# Sensor fusion on the car (robot_localization EKF), used by `rr car-odom`.
#
# Inputs:
#   odom0 = /odom_rf2o        position and heading worked out from the lidar (scan matching)
#   imu0  = /sensors/imu/raw  the VESC's IMU: turn rate and acceleration
#   odom1 = /odom             the WHEELS (VESC). Works once only one copy of the drivers runs.
#
# Only ONE node may publish the odom -> base_link transform. This EKF does, so the VESC's odometry node
# is told not to (publish_tf: false in the car's vesc.yaml). Two publishers make SLAM drop every scan.
#
# The EKF publishes the odom -> base_link transform that slam_toolbox needs, so rf2o is told not to.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true                # a car on a flat floor: no roll, pitch or z
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # [x, y, z,  roll, pitch, yaw,  vx, vy, vz,  vroll, vpitch, vyaw,  ax, ay, az]
    odom0: /odom_rf2o
    odom0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 5

    imu0: /sensors/imu/raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  true,  false, false]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    odom1: /odom                    # wheel odometry from the VESC (speed + turn rate)
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 5
